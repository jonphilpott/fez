<body>
<header class="top">
  <h1>{{TITLE}}</h1>
  <p><b>Personal Sound Computer</b><br>a forth programmable virtual analog synth engine</p>
</header>
<div class="page">
  <nav id="toc" aria-label="Contents">
    <input id="q" type="search" placeholder="Filter the lists" aria-label="Filter the word and register lists">
{{NAV}}
  </nav>
  <main>
{{CONTENT}}
  </main>
</div>
<script>
/* Two small jobs, no libraries: the filter box hides reference rows that do not match, and the contents list lights the chapter in view. */
(function () {
  var box = document.getElementById("q");
  box.addEventListener("input", function () {
    var needle = box.value.trim().toLowerCase();
    document.querySelectorAll(".ref-row").forEach(function (row) {
      row.classList.toggle("hide", needle !== "" && row.textContent.toLowerCase().indexOf(needle) < 0);
    });
    document.querySelectorAll("tr.grp").forEach(function (g) { g.classList.toggle("hide", needle !== ""); });   /* group headings are noise while filtering */
  });
  var links = {};
  document.querySelectorAll("nav#toc a").forEach(function (a) { links[a.getAttribute("href").slice(1)] = a; });
  if ("IntersectionObserver" in window) {
    document.querySelectorAll("section.chapter").forEach(function (sec) {
      /* one observer per chapter, so each reports on its own: it counts as "in view" when it reaches the upper part of the window */
      new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (!e.isIntersecting) return;
          Object.keys(links).forEach(function (k) { links[k].classList.toggle("on", k === sec.id); });
        });
      }, { rootMargin: "0px 0px -70% 0px" }).observe(sec);
    });
  }
})();
</script>
</body>
